<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>飞机大战 - Boss Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;overflow:hidden;background:#000;
  touch-action:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-overflow-scrolling:none;overscroll-behavior:none;
}
#game{
  display:block;position:fixed;top:0;left:0;right:0;bottom:0;
  width:100vw;height:100dvh;height:100vh;
}
#ui{
  position:fixed;bottom:max(20px,env(safe-area-inset-bottom,20px));left:50%;
  transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:10;
  pointer-events:none;
}
#ui>*{pointer-events:auto}
#start-btn{
  background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;border:none;padding:14px 42px;

  box-shadow:0 0 30px rgba(255,107,107,.5),0 4px 15px rgba(0,0,0,.4);transition:all .2s;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;position:relative;overflow:hidden;
}
#start-btn:active{transform:scale(.95);box-shadow:0 0 50px rgba(255,107,107,.8)}
#start-btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,.3);transform:translate(-50%,-50%);transition:all .4s}
#start-btn:active::after{width:300px;height:300px}
#bomb-btn{
  background:linear-gradient(135deg,#e67e22,#d35400);color:#fff;border:none;width:56px;height:56px;
  font-size:24px;border-radius:50%;cursor:pointer;box-shadow:0 0 20px rgba(230,126,34,.5);
  display:none;transition:all .2s
}
#bomb-btn:active{transform:scale(.9);box-shadow:0 0 35px rgba(230,126,34,.8)}
#mobile-hint{color:rgba(255,255,255,.5);font-size:13px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:none}
#crt-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
}
#crt-overlay::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.3) 100%);
  pointer-events:none;
}

<body>
<canvas id="game"></canvas>
<div id="ui">
  <button id="start-btn">开始战斗</button>
  <button id="bomb-btn">💣</button>
  <div id="mobile-hint">📱 滑动屏幕操控飞机</div>
</div>
<div id="crt-overlay"></div>
<script>
// ==================== AUDIO ENGINE ====================
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){
  if(!audioCtx){audioCtx=new AudioCtx()}
  if(audioCtx.state==='suspended'){audioCtx.resume()}
}
function playBeep(freq,type,dur,vol=.1,slide=0){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.linearRampToValueAtTime(freq+slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+dur);
}
function sfxShoot(){playBeep(800,'square',.05,.03)}
function sfxHit(){playBeep(200,'sawtooth',.15,.08,-100)}
function sfxExplosion(){playBeep(80,'sawtooth',.3,.1,-40);playBeep(60,'square',.25,.15,-30)}
function sfxPowerUp(){playBeep(600,'square',.08,.06);setTimeout(()=>playBeep(900,'square',.08,.06),80)}
function sfxBossHit(){playBeep(120,'sawtooth',.2,.12);playBeep(40,'triangle',.3,.15)}
function sfxBossIntro(){playBeep(200,'triangle',.4,.15,100);setTimeout(()=>playBeep(400,'triangle',.3,.1,200),150);setTimeout(()=>playBeep(600,'triangle',.3,.1,300),300)}
function sfxGameOver(){playBeep(400,'triangle',.2,.3,-300);setTimeout(()=>playBeep(200,'triangle',.2,.3,-150),300);setTimeout(()=>playBeep(100,'triangle',.3,.5,-80),600)}
function sfxVictory(){[0,150,300,450,600,750].forEach((d,i)=>setTimeout(()=>playBeep(300+i*80,'triangle',.2,.12,100),d))}
function sfxCombo(){playBeep(500,'square',.04,.03,200)}
function sfxBomb(){playBeep(40,'sawtooth',.5,.2,-20);playBeep(30,'square',.6,.25)}

// ==================== BROWSER COMPATIBILITY ====================
// Polyfill for ctx.ellipse() - missing in older WebViews (UC, old WeChat, etc.)
if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.ellipse){
  CanvasRenderingContext2D.prototype.ellipse=function(x,y,rx,ry,rot,sa,ea,ccw){
    this.save();this.translate(x,y);this.rotate(rot);this.scale(rx,ry);
    this.arc(0,0,1,sa,ea,ccw);this.restore();
  };
}

// ==================== CANVAS SETUP ====================
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=480,H=800;
let scale=1,offsetX=0,offsetY=0;

function getViewportSize(){
  // visualViewport handles iOS Safari toolbar correctly
  const vv=window.visualViewport;
  if(vv)return{w:Math.floor(vv.width),h:Math.floor(vv.height)};
  return{w:window.innerWidth||document.documentElement.clientWidth||360,h:window.innerHeight||document.documentElement.clientHeight||640};
}

function resize(){
  const vp=getViewportSize();
  const maxW=vp.w,maxH=vp.h;
  scale=Math.min(maxW/W,maxH/H);
  canvas.width=maxW;canvas.height=maxH;
  canvas.style.width=maxW+'px';canvas.style.height=maxH+'px';
  offsetX=(maxW-W*scale)/2;offsetY=(maxH-H*scale)/2;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>{
  setTimeout(resize,200);setTimeout(resize,500);setTimeout(resize,1000);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',resize);
  window.visualViewport.addEventListener('scroll',()=>{if(Math.abs(window.visualViewport.offsetTop)>0)resize()});
}
// 阻止全局滚动和缩放
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>{e.preventDefault()});
document.addEventListener('gesturechange',e=>{e.preventDefault()});
document.addEventListener('gestureend',e=>{e.preventDefault()});
document.addEventListener('dblclick',e=>{e.preventDefault()},{passive:false});
// Hide iOS Safari URL bar on load
window.addEventListener('load',()=>{
  setTimeout(()=>{window.scrollTo(0,0);resize()},100);
  setTimeout(()=>{window.scrollTo(0,0);resize()},300);
  setTimeout(()=>{window.scrollTo(0,0);resize()},600);
});
resize();

// ==================== GAME STATE ====================
const STATE={LOADING:0,MENU:1,DIFF_SELECT:7,PLAYING:2,BOSS_INTRO:3,LEVEL_COMPLETE:4,GAME_OVER:5,VICTORY:6};
let state=STATE.MENU;
let difficulty='easy';
let score=0,lives=5,level=0,bombs=3;
let stateTimer=0,bossIntroTimer=0,levelCompleteTimer=0;
let shakeAmount=0,shakeDuration=0;
let frameCount=0;
let bombFlash=0;

const bossNames=['李亚增','李彦祥','李飞','杨小军','王小涛','伍建忠'];
const bossColors={
  '李亚增':{body:'#c0392b',accent:'#e74c3c',glow:'#f39c12',face:'#2c3e50'},
  '李彦祥':{body:'#2471a3',accent:'#5dade2',glow:'#85c1e9',face:'#1a5276'},
  '李飞':{body:'#6c3483',accent:'#bb8fce',glow:'#d7bde2',face:'#4a235a'},
  '杨小军':{body:'#1e8449',accent:'#2ecc71',glow:'#58d68d',face:'#145a32'},
  '王小涛':{body:'#b7950b',accent:'#f1c40f',glow:'#f9e79f',face:'#7d6608'},
  '伍建忠':{body:'#6e2c00',accent:'#e67e22',glow:'#f0b27a',face:'#3e1700'}
};

// ==================== INPUT ====================
const keys={};
let touchActive=false,touchX=0,touchY=0;
let playerTouchOffsetX=0,playerTouchOffsetY=0;

function getGamePos(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return {
    x:(clientX-r.left-offsetX)/scale,
    y:(clientY-r.top-offsetY)/scale
  };
}

function enterFullscreen(){
  window.scrollTo(0,0);
  // 尝试进入浏览器全屏
  const d=document.documentElement;
  const fn=d.requestFullscreen||d.webkitRequestFullscreen||d.msRequestFullscreen;
  if(fn){try{fn.call(d)}catch(e){}}
}

window.addEventListener('keydown',e=>{keys[e.key]=true;e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key]=false});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();enterFullscreen();
  const gp=getGamePos(e.touches[0].clientX,e.touches[0].clientY);
  if(state===STATE.MENU){startGame()}
  else if(state===STATE.GAME_OVER||state===STATE.VICTORY){resetGame()}
  else if(state===STATE.DIFF_SELECT){handleDiffTap(gp.x,gp.y)}
  else{touchActive=true;touchX=gp.x;touchY=gp.y;playerTouchOffsetX=player.x-gp.x;playerTouchOffsetY=player.y-gp.y}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!touchActive)return;
  const gp=getGamePos(e.touches[0].clientX,e.touches[0].clientY);
  touchX=gp.x;touchY=gp.y;
},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();touchActive=false},{passive:false});
canvas.addEventListener('click',e=>{
  initAudio();enterFullscreen();
  const gp=getGamePos(e.clientX,e.clientY);
  if(state===STATE.MENU){startGame()}
  else if(state===STATE.GAME_OVER||state===STATE.VICTORY){resetGame()}
  else if(state===STATE.DIFF_SELECT){handleDiffTap(gp.x,gp.y)}
});
// HTML按钮也需要处理游戏逻辑
document.getElementById('start-btn').addEventListener('click',()=>{
  initAudio();enterFullscreen();
  if(state===STATE.MENU)startGame();
  else if(state===STATE.GAME_OVER||state===STATE.VICTORY)resetGame();
});
document.getElementById('start-btn').addEventListener('touchstart',e=>{
  e.preventDefault();e.stopPropagation();
  initAudio();enterFullscreen();
  if(state===STATE.MENU)startGame();
  else if(state===STATE.GAME_OVER||state===STATE.VICTORY)resetGame();
},{passive:false});
document.getElementById('bomb-btn').addEventListener('click',()=>{
  initAudio();enterFullscreen();
  if(state===STATE.PLAYING)useBomb();
});
document.getElementById('bomb-btn').addEventListener('touchstart',e=>{
  e.preventDefault();e.stopPropagation();
  initAudio();enterFullscreen();
  if(state===STATE.PLAYING)useBomb();
},{passive:false});
// 阻止长按菜单
document.addEventListener('contextmenu',e=>{e.preventDefault()});

function handleDiffTap(x,y){
  if(x>W/2-100&&x<W/2+100){
    if(y>H/2+30&&y<H/2+80){difficulty='easy';resetGame()}
    else if(y>H/2+95&&y<H/2+145){difficulty='hard';resetGame()}
  }
}

// ==================== PARTICLE SYSTEM ====================
const MAX_PARTICLES=300;
const particles=[];
let particleIndex=0;

class Particle{
  constructor(){this.reset()}
  reset(){this.x=0;this.y=0;this.vx=0;this.vy=0;this.life=0;this.maxLife=0;this.color='#fff';this.size=2;this.type='dot';this.gravity=0;this.friction=1}
  init(x,y,vx,vy,color,life,size,type,gravity,friction){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.life=life;this.maxLife=life;
    this.size=size||2;this.type=type||'dot';this.gravity=gravity||0;this.friction=friction||1;
    return this;
  }
  update(){
    this.vx*=this.friction;this.vy*=this.friction;this.vy+=this.gravity;
    this.x+=this.vx;this.y+=this.vy;this.life--;
  }
  draw(ctx){
    const a=this.life/this.maxLife;
    ctx.globalAlpha=a;
    if(this.type==='glow'){
      const r=this.size*(1+a*.5);
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r);
      g.addColorStop(0,this.color);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI*2);ctx.fill();
    }else if(this.type==='trail'){
      ctx.fillStyle=this.color;ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
    }else if(this.type==='spark'){
      ctx.strokeStyle=this.color;ctx.lineWidth=this.size*a;ctx.globalAlpha=a;
      ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-this.vx*2,this.y-this.vy*2);ctx.stroke();
    }else{
      ctx.fillStyle=this.color;ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size*a,this.size*a);
    }
    ctx.globalAlpha=1;
  }
}

function spawnParticle(x,y,vx,vy,color,life,size,type,gravity,friction){
  let p;
  if(particles.length<MAX_PARTICLES){
    p=new Particle();
    particles.push(p);
  }else{
    p=particles[particleIndex%MAX_PARTICLES];
  }
  particleIndex++;
  return p.init(x,y,vx,vy,color,life,size||2,type||'dot',gravity||0,friction==null?1:friction);
}

function spawnExplosion(x,y,count,color){
  const colors=color?[color,color,color]:['#ff6b6b','#ffd93d','#ff8e53','#ff3838','#fff','#ffaa00'];
  // Fireball core
  for(let i=0;i<Math.floor(count*.3);i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,colors[0],8+Math.random()*10,4+Math.random()*6,'glow',0,.96);
  }
  // Debris
  for(let i=0;i<Math.floor(count*.4);i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*6;
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,colors[Math.floor(Math.random()*colors.length)],12+Math.random()*18,2+Math.random()*3,'spark',.02,.98);
  }
  // Smoke
  for(let i=0;i<Math.floor(count*.3);i++){
    const a=Math.random()*Math.PI*2,s=.5+Math.random()*2;
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s-.5,'#888',15+Math.random()*25,3+Math.random()*5,'trail',-.01,.99);
  }
}

function spawnHitSpark(x,y,color){
  for(let i=0;i<4;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,color||'#fff',6+Math.random()*8,1.5,'spark',0,.95);
  }
}

function spawnBulletTrail(x,y,color){
  spawnParticle(x,y,(Math.random()-.5)*.5,(Math.random()-.5)*.5,color,4+Math.random()*6,1+Math.random()*2,'glow',0,.9);
}

function spawnEngineParticle(x,y){
  spawnParticle(x+Math.random()*6-3,y,Math.random()*.5-.25,1+Math.random()*2,'#ff6b35',8+Math.random()*8,2+Math.random()*3,'glow',.01,.97);
  if(Math.random()<.3)spawnParticle(x+Math.random()*4-2,y,(Math.random()-.5)*.3,1.5+Math.random()*2,'#ffaa00',6+Math.random()*6,1.5+Math.random()*2,'trail',.01,.96);
}

// ==================== BACKGROUND SYSTEM ====================
const bgStars=[],bgNebula=[],bgFlow=[];

function initBackground(){
  bgStars.length=0;bgNebula.length=0;bgFlow.length=0;
  // Layer 1: distant stars (twinkling)
  for(let i=0;i<120;i++){
    bgStars.push({x:Math.random()*W,y:Math.random()*H,size:.3+Math.random()*1.8,brightness:.3+Math.random()*.7,twinkle:Math.random()*Math.PI*2,twinkleSpd:.01+Math.random()*.03});
  }
  // Layer 2: nebula blobs
  for(let i=0;i<8;i++){
    bgNebula.push({x:Math.random()*W,y:Math.random()*H,r:60+Math.random()*120,color:['rgba(30,60,120,.06)','rgba(60,20,80,.05)','rgba(20,60,100,.04)'][Math.floor(Math.random()*3)],vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.15});
  }
  // Layer 3: flow particles
  for(let i=0;i<40;i++){
    bgFlow.push({x:Math.random()*W,y:Math.random()*H,speed:.3+Math.random()*1.2,size:.5+Math.random()*1,alpha:.1+Math.random()*.3,len:15+Math.random()*30});
  }
}

function drawBackground(ctx){
  // Deep space gradient
  const bgG=ctx.createLinearGradient(0,0,0,H);
  const hueShift=state===STATE.BOSS_INTRO?.3:(boss&&boss.hp<boss.maxHp*.3?.15:0);
  bgG.addColorStop(0,'#050510');bgG.addColorStop(.5,'#0a0a20');bgG.addColorStop(1,'#0d0d2a');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);

  const spd=(state===STATE.PLAYING||state===STATE.BOSS_INTRO)?1:.5;
  const bossNearDeath=boss&&boss.hp<boss.maxHp*.3;

  // Nebula blobs
  ctx.globalCompositeOperation='lighter';
  bgNebula.forEach(n=>{
    n.x+=n.vx*spd*.3;n.y+=n.vy*spd*.3;
    if(n.x<-n.r)n.x=W+n.r;if(n.x>W+n.r)n.x=-n.r;
    if(n.y<-n.r)n.y=H+n.r;if(n.y>H+n.r)n.y=-n.r;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    const c=bossNearDeath?'rgba(80,10,10,.08)':n.color;
    g.addColorStop(0,c);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';

  // Twinkling stars
  bgStars.forEach(s=>{
    s.twinkle+=s.twinkleSpd;
    const b=s.brightness*(.6+.4*Math.sin(s.twinkle));
    s.y+=s.size*spd*.6;if(s.y>H){s.y=0;s.x=Math.random()*W}
    ctx.fillStyle=`rgba(200,220,255,${b})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.size*.7,0,Math.PI*2);ctx.fill();
    // Bright stars get cross glow
    if(s.size>1.2&&b>.7){
      ctx.fillStyle=`rgba(200,220,255,${b*.3})`;
      ctx.fillRect(s.x-s.size*2,s.y-.3,s.size*4,.6);
      ctx.fillRect(s.x-.3,s.y-s.size*2,.6,s.size*4);
    }
  });

  // Flow lines
  ctx.globalCompositeOperation='lighter';
  bgFlow.forEach(f=>{
    f.y+=f.speed*spd;if(f.y>H+f.len){f.y=-f.len;f.x=Math.random()*W}
    const g=ctx.createLinearGradient(f.x,f.y,f.x,f.y+f.len);
    g.addColorStop(0,`rgba(100,150,255,${f.alpha})`);g.addColorStop(1,'transparent');
    ctx.strokeStyle=g;ctx.lineWidth=f.size;
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y+f.len);ctx.stroke();
  });
  ctx.globalCompositeOperation='source-over';
}

// ==================== COMBO SYSTEM ====================
let comboCount=0,comboTimer=0,comboDisplay=0,comboFlash=0;
let rageMode=false,rageTimer=0;
let lastShockwave=0;

function addCombo(){
  comboCount++;comboTimer=90;
  if(comboCount>=30&&!rageMode){rageMode=true;rageTimer=300}
  if(comboCount>=50&&frameCount-lastShockwave>3600){
    lastShockwave=frameCount;
    // Auto shockwave
    enemies.forEach(e=>{e.hp=0;score+=e.score;spawnExplosion(e.x,e.y,12)});
    enemies.length=0;
    bullets=bullets.filter(b=>b.isPlayer);
    shakeAmount=8;
    sfxExplosion();
  }
  if(comboCount%10===0)sfxCombo();
  comboFlash=15;
  // "+N" popup particles
  for(let i=0;i<3;i++){
    spawnParticle(player.x+Math.random()*20-10,player.y-30,Math.random()*1-.5,-1-Math.random()*2,'#ffd93d',20+Math.random()*10,2,'trail',-.01,.98);
  }
}

function updateCombo(){
  if(comboTimer>0){comboTimer--;if(comboTimer<=0){comboCount=0;rageMode=false}}
  if(comboDisplay<comboCount){comboDisplay=Math.min(comboCount,comboDisplay+Math.max(1,Math.floor((comboCount-comboDisplay)*.3)))}
  if(comboDisplay>comboCount)comboDisplay=comboCount;
  if(comboFlash>0)comboFlash--;
  if(rageMode){rageTimer--;if(rageTimer<=0)rageMode=false}
}

// ==================== SCREEN SHAKE ====================
function addShake(amount,duration){
  shakeAmount=Math.max(shakeAmount,amount);
  shakeDuration=Math.max(shakeDuration,duration||0);
}

function updateShake(){
  if(shakeAmount>0){shakeAmount*=.85;if(shakeAmount<.3)shakeAmount=0}
  if(shakeDuration>0)shakeDuration--;
}

// ==================== SCORE POPUPS ====================
const scorePopups=[];
function addScorePopup(x,y,pts){
  scorePopups.push({x:x,y:y,pts:pts,life:40,vy:-2});
}

// ==================== GAME OBJECTS ====================
let player,enemies,bullets,powerUps,boss,stars;
let waveEnemies=[],wavesCleared=0,wavesPerLevel=5;

class Player{
  constructor(){
    this.w=36;this.h=48;this.x=W/2;this.y=H-100;this.speed=6;
    this.power=1;this.shield=false;this.invincible=0;this.shootCD=0;
    this.engineFlame=0;this.shieldAngle=0;
    this.trailPositions=[];this.trailTimer=0;
  }
  update(){
    this.shieldAngle+=.04;
    // Movement input
    let mx=0,my=0;
    if(touchActive){
      const tx=touchX+playerTouchOffsetX,ty=touchY+playerTouchOffsetY;
      mx=(tx-this.x)*.3;my=(ty-this.y)*.3;
    }
    if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-this.speed;
    if(keys['ArrowRight']||keys['d']||keys['D'])mx=this.speed;
    if(keys['ArrowUp']||keys['w']||keys['W'])my=-this.speed;
    if(keys['ArrowDown']||keys['s']||keys['S'])my=this.speed;
    this.x+=mx;this.y+=my;
    this.x=Math.max(this.w/2,Math.min(W-this.w/2,this.x));
    this.y=Math.max(40,Math.min(H-40,this.y));

    // Movement trail
    if(Math.abs(mx)>.5||Math.abs(my)>.5){
      this.trailTimer++;
      if(this.trailTimer%2===0){
        this.trailPositions.push({x:this.x,y:this.y,life:10});
        if(this.trailPositions.length>6)this.trailPositions.shift();
      }
    }else{this.trailTimer=0}
    this.trailPositions.forEach(t=>t.life--);
    this.trailPositions=this.trailPositions.filter(t=>t.life>0);

    if(this.invincible>0)this.invincible--;
    if(this.shootCD>0)this.shootCD--;
    const baseShootCD=difficulty==='easy'?10:14;
    if(this.shootCD<=0){
      this.shoot();
      this.shootCD=this.power>=3?Math.floor(baseShootCD*.5):this.power>=2?Math.floor(baseShootCD*.75):baseShootCD;
    }
    this.engineFlame+=.3;
  }
  shoot(){
    sfxShoot();
    const bx=this.x,by=this.y-this.h/2;
    const bs=rageMode?1.2:1;
    if(this.power===1){
      bullets.push(new Bullet(bx,by,0,-10*bs,true));
    }else if(this.power===2){
      bullets.push(new Bullet(bx-5,by,0,-10*bs,true));
      bullets.push(new Bullet(bx+5,by,0,-10*bs,true));
    }else{
      bullets.push(new Bullet(bx,by,0,-10*bs,true));
      bullets.push(new Bullet(bx-8,by,-1.5,-9*bs,true));
      bullets.push(new Bullet(bx+8,by,1.5,-9*bs,true));
    }
    // Muzzle flash particles
    for(let i=0;i<2;i++)spawnParticle(bx,by,Math.random()*2-1,-2-Math.random()*2,'#f1c40f',3+Math.random()*3,2,'glow');
  }
  hit(){
    if(this.invincible>0)return false;
    sfxHit();
    addShake(6,8);
    comboCount=0;comboTimer=0;rageMode=false;
    if(this.shield){this.shield=false;this.invincible=40;spawnExplosion(this.x,this.y,15,'#2ecc71');return false}
    lives--;
    this.invincible=90;
    spawnExplosion(this.x,this.y,10,'#ff6b6b');
    if(lives<=0){state=STATE.GAME_OVER;sfxGameOver();addShake(20,30)}
  }
  draw(ctx){
    if(this.invincible>0&&Math.floor(this.invincible/4)%2===0)return;
    ctx.save();
    ctx.translate(this.x,this.y);
    const rage=rageMode;

    // Movement trail afterimages
    this.trailPositions.forEach(t=>{
      const a=t.life/10*.25;
      ctx.save();ctx.globalAlpha=a;ctx.translate(t.x-this.x,t.y-this.y);
      this.drawBody(ctx,true);
      ctx.restore();
    });

    this.drawBody(ctx,false);
    ctx.restore();
  }
  drawBody(ctx,isTrail){
    const rage=rageMode;
    // Engine flame
    const fl=Math.sin(this.engineFlame)*6+14;
    const fc=rage?3:2;
    for(let i=0;i<(rage?5:3);i++){
      const fx=(i-(rage?2:1))*5;
      const g=ctx.createLinearGradient(fx,this.h/2-6,fx,this.h/2+fl);
      g.addColorStop(0,rage?'#ff4444':'#ff8c42');g.addColorStop(.4,rage?'#ff0000':'#ff4500');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      const fw=rage?5:3;
      ctx.beginPath();ctx.moveTo(fx-fw,this.h/2-6);ctx.lineTo(fx,this.h/2+fl);ctx.lineTo(fx+fw,this.h/2-6);ctx.fill();
    }

    if(!isTrail&&frameCount%2===0){
      spawnEngineParticle(this.x,this.y+this.h/2);
      if(rage)spawnEngineParticle(this.x+Math.random()*6-3,this.y+this.h/2+5);
    }

    // === MAIN BODY ===
    const w=this.w,h=this.h;
    // Body gradient - metallic blue
    const bodyG=ctx.createLinearGradient(-w/2,0,w/2,0);
    bodyG.addColorStop(0,rage?'#8b0000':'#1a3a5c');bodyG.addColorStop(.2,rage?'#cc2222':'#2980b9');bodyG.addColorStop(.5,rage?'#ff3333':'#5dade2');bodyG.addColorStop(.8,rage?'#cc2222':'#2980b9');bodyG.addColorStop(1,rage?'#8b0000':'#1a3a5c');
    ctx.fillStyle=bodyG;
    // Sleek fighter silhouette
    ctx.beginPath();
    ctx.moveTo(0,-h/2); // nose
    ctx.lineTo(w/2-2,-10);ctx.lineTo(w/2,4); // right upper
    ctx.lineTo(w/2-3,h/2-6);ctx.lineTo(w/2-8,h/2-2); // right rear
    ctx.lineTo(-w/2+8,h/2-2);ctx.lineTo(-w/2+3,h/2-6); // left rear
    ctx.lineTo(-w/2,4);ctx.lineTo(-w/2+2,-10); // left upper
    ctx.closePath();ctx.fill();
    // Edge highlight
    ctx.strokeStyle=rage?'rgba(255,150,150,.5)':'rgba(150,210,255,.5)';ctx.lineWidth=1.2;ctx.stroke();

    // Inner body panel (darker)
    ctx.fillStyle=rage?'rgba(80,0,0,.4)':'rgba(10,30,60,.4)';
    ctx.beginPath();
    ctx.moveTo(0,-h/2+4);ctx.lineTo(6,-6);ctx.lineTo(8,4);ctx.lineTo(5,h/2-10);
    ctx.lineTo(-5,h/2-10);ctx.lineTo(-8,4);ctx.lineTo(-6,-6);
    ctx.closePath();ctx.fill();

    // === COCKPIT ===
    const ckG=ctx.createRadialGradient(1,-8,2,0,-5,13);
    ckG.addColorStop(0,'rgba(255,255,255,.9)');ckG.addColorStop(.3,'rgba(180,220,255,.7)');ckG.addColorStop(.7,'rgba(20,60,100,.8)');ckG.addColorStop(1,'rgba(10,30,60,.9)');
    ctx.fillStyle=ckG;
    ctx.beginPath();ctx.ellipse(0,-6,6.5,13,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=rage?'rgba(255,150,150,.6)':'rgba(150,210,255,.6)';ctx.lineWidth=1;ctx.stroke();
    // Cockpit reflection
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-2,-10,2,4.5,-.3,0,Math.PI*2);ctx.fill();

    // === WINGS ===
    // Left wing
    const wlG=ctx.createLinearGradient(-w/2,0,0,0);
    wlG.addColorStop(0,rage?'#550000':'#0d2240');wlG.addColorStop(.5,rage?'#aa1111':'#1a5276');wlG.addColorStop(1,rage?'#cc3333':'#2e86c1');
    ctx.fillStyle=wlG;
    ctx.beginPath();ctx.moveTo(-w/2+3,-4);ctx.lineTo(-w/2-3,6);ctx.lineTo(-w/2-3,14);ctx.lineTo(-w/2+2,10);ctx.closePath();ctx.fill();
    ctx.strokeStyle=rage?'rgba(255,120,120,.4)':'rgba(150,210,255,.4)';ctx.lineWidth=1;ctx.stroke();
    // Right wing
    const wrG=ctx.createLinearGradient(w/2,0,0,0);
    wrG.addColorStop(0,rage?'#550000':'#0d2240');wrG.addColorStop(.5,rage?'#aa1111':'#1a5276');wrG.addColorStop(1,rage?'#cc3333':'#2e86c1');
    ctx.fillStyle=wrG;
    ctx.beginPath();ctx.moveTo(w/2-3,-4);ctx.lineTo(w/2+3,6);ctx.lineTo(w/2+3,14);ctx.lineTo(w/2-2,10);ctx.closePath();ctx.fill();
    ctx.strokeStyle=rage?'rgba(255,120,120,.4)':'rgba(150,210,255,.4)';ctx.lineWidth=1;ctx.stroke();

    // Wing power indicators
    const pwCol=this.power>=3?'#f1c40f':this.power>=2?'#f39c12':'#2471a3';
    ctx.fillStyle=pwCol;ctx.shadowColor=pwCol;ctx.shadowBlur=this.power>=3?6:this.power>=2?4:0;
    ctx.fillRect(-w/2-1,8,4,2);ctx.fillRect(w/2-3,8,4,2);
    ctx.shadowBlur=0;

    // === NOSE DETAILS ===
    ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(0,-h/2+3,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(0,-h/2+2.5,1,0,Math.PI*2);ctx.fill();

    // === ENGINE PODS ===
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.moveTo(-5,h/2-10);ctx.lineTo(2,h/2-4);ctx.lineTo(2,h/2-1);ctx.lineTo(-3,h/2-6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(5,h/2-10);ctx.lineTo(-2,h/2-4);ctx.lineTo(-2,h/2-1);ctx.lineTo(3,h/2-6);ctx.closePath();ctx.fill();
    // Engine rims
    ctx.fillStyle='#555';
    ctx.fillRect(-6,h/2-6,3.5,4);ctx.fillRect(2.5,h/2-6,3.5,4);

    // === HEX SHIELD ===
    if(this.shield&&!isTrail){
      ctx.strokeStyle='rgba(46,204,113,.7)';ctx.lineWidth=2.5;
      const hexR=w/2+15;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=this.shieldAngle+Math.PI/6*i;
        const px=Math.cos(a)*hexR,py=Math.sin(a)*hexR;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.stroke();
      ctx.strokeStyle='rgba(46,204,113,.25)';ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=this.shieldAngle+.1+Math.PI/6*i;
        const px=Math.cos(a)*(hexR+5),py=Math.sin(a)*(hexR+5);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.stroke();
    }
  }
}

class Enemy{
  constructor(x,y,type){
    this.x=x;this.y=y;
    this.type=type||'small';
    if(type==='small'){this.w=26;this.h=28;this.hp=1;this.speed=difficulty==='easy'?2:3;this.score=100}
    else if(type==='medium'){this.w=36;this.h=36;this.hp=difficulty==='easy'?1:2;this.speed=difficulty==='easy'?1.5:2;this.score=200}
    else{this.w=48;this.h=48;this.hp=difficulty==='easy'?2:4;this.speed=difficulty==='easy'?1:1.5;this.score=400}
    this.shootTimer=60+Math.random()*120;
    this.wobble=Math.random()*Math.PI*2;
    this.flashTimer=0;
    this.engineGlow=Math.random()*Math.PI*2;
  }
  update(){
    this.y+=this.speed;
    this.wobble+=.05;
    this.engineGlow+=.3;
    this.x+=Math.sin(this.wobble)*.5;
    this.shootTimer--;
    if(this.flashTimer>0)this.flashTimer--;
    if(this.shootTimer<=0){
      const sm=difficulty==='easy'?2.2:1;
      this.shootTimer=(this.type==='small'?120+Math.random()*80:this.type==='medium'?80+Math.random()*70:55+Math.random()*55)*sm;
      const angle=Math.atan2(player.y-this.y,player.x-this.x);
      const bs=(difficulty==='easy'?1.5:2.5);
      bullets.push(new Bullet(this.x,this.y,Math.cos(angle)*bs,Math.sin(angle)*bs,false));
    }
  }
  hit(dmg){
    this.hp-=dmg;this.flashTimer=4;
    spawnHitSpark(this.x,this.y,'#fff');
    if(this.hp<=0){
      score+=this.score;
      addScorePopup(this.x,this.y,this.score);
      addCombo();
      spawnExplosion(this.x,this.y,this.type==='large'?20:12);
      // Higher power-up drop rate, especially early
      const dropRate=level===0?.18:.12;
      if(Math.random()<dropRate||(this.type==='large'&&Math.random()<.5))spawnPowerUp(this.x,this.y);
      return true;
    }
    return false;
  }
  draw(ctx){
    ctx.save();ctx.translate(this.x,this.y);
    const w=this.w,h=this.h,fl=Math.sin(this.engineGlow)*.3+.7;

    if(this.flashTimer>0&&this.flashTimer%2===0){ctx.globalAlpha=.5}

    if(this.type==='small'){
      // === RED SCOUT DRONE ===
      const bg=ctx.createLinearGradient(-w/2,0,w/2,0);
      bg.addColorStop(0,'#4a0f0f');bg.addColorStop(.3,'#c0392b');bg.addColorStop(.6,'#e74c3c');bg.addColorStop(1,'#4a0f0f');
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.moveTo(0,h/2);
      ctx.lineTo(w/2-2,2);ctx.lineTo(w/2,-5);ctx.lineTo(w/2-3,-h/2+4);
      ctx.lineTo(3,-h/2+2);ctx.lineTo(-3,-h/2+2);
      ctx.lineTo(-w/2+3,-h/2+4);ctx.lineTo(-w/2,-5);ctx.lineTo(-w/2+2,2);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#ff9999';ctx.lineWidth=.8;ctx.stroke();

      // Panel line
      ctx.fillStyle='rgba(0,0,0,.3)';
      ctx.beginPath();ctx.moveTo(0,h/2-4);ctx.lineTo(3,0);ctx.lineTo(w/2-4,-5);ctx.lineTo(w/2-6,-h/2+8);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(0,h/2-4);ctx.lineTo(-3,0);ctx.lineTo(-w/2+4,-5);ctx.lineTo(-w/2+6,-h/2+8);ctx.closePath();ctx.fill();

      // Cockpit
      ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.ellipse(0,2,3.5,6.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.ellipse(0,1,2,4,0,0,Math.PI*2);ctx.fill();

      // Rear fins
      ctx.fillStyle='#7b1f1f';
      ctx.beginPath();ctx.moveTo(-w/2,-2);ctx.lineTo(-w/2-3,-h/2+6);ctx.lineTo(-w/2+2,-h/2+4);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(w/2,-2);ctx.lineTo(w/2+3,-h/2+6);ctx.lineTo(w/2-2,-h/2+4);ctx.closePath();ctx.fill();

      // Engines
      ctx.fillStyle='#333';ctx.fillRect(-5,-h/2+1,2.5,4);ctx.fillRect(2.5,-h/2+1,2.5,4);
      ctx.fillStyle='#ff6600';ctx.shadowColor='#ff6600';ctx.shadowBlur=4*fl;
      ctx.fillRect(-4.5,-h/2,2,2);ctx.fillRect(3,-h/2,2,2);
      ctx.shadowBlur=0;

    }else if(this.type==='medium'){
      // === ORANGE INTERCEPTOR ===
      const bg=ctx.createLinearGradient(-w/2,0,w/2,0);
      bg.addColorStop(0,'#4a1a00');bg.addColorStop(.3,'#d35400');bg.addColorStop(.6,'#e67e22');bg.addColorStop(1,'#4a1a00');
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.moveTo(0,h/2);
      ctx.lineTo(7,6);ctx.lineTo(w/2,-1);ctx.lineTo(w/2-3,-h/2+6);
      ctx.lineTo(5,-h/2+2);ctx.lineTo(-5,-h/2+2);
      ctx.lineTo(-w/2+3,-h/2+6);ctx.lineTo(-w/2,-1);ctx.lineTo(-7,6);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#f5b041';ctx.lineWidth=1;ctx.stroke();

      // Armor accent
      ctx.fillStyle='rgba(0,0,0,.25)';
      ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(5,4);ctx.lineTo(w/2-3,0);ctx.lineTo(w/2-5,-h/2+14);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(-5,4);ctx.lineTo(-w/2+3,0);ctx.lineTo(-w/2+5,-h/2+14);ctx.closePath();ctx.fill();

      // Cockpit
      const ckg=ctx.createRadialGradient(0,4,2,0,2,9);
      ckg.addColorStop(0,'rgba(255,255,255,.5)');ckg.addColorStop(.5,'rgba(255,255,200,.2)');ckg.addColorStop(1,'rgba(0,0,0,.6)');
      ctx.fillStyle=ckg;ctx.beginPath();ctx.ellipse(0,3,5,9,0,0,Math.PI*2);ctx.fill();
      // Reflection
      ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(-1,1,1.8,3.5,0,0,Math.PI*2);ctx.fill();

      // Rear fins
      ctx.fillStyle='#a04000';
      ctx.beginPath();ctx.moveTo(-w/2,-3);ctx.lineTo(-w/2-5,-h/2+6);ctx.lineTo(-w/2+3,-h/2+4);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(w/2,-3);ctx.lineTo(w/2+5,-h/2+6);ctx.lineTo(w/2-3,-h/2+4);ctx.closePath();ctx.fill();

      // Twin engines
      ctx.fillStyle='#333';ctx.fillRect(-9,-h/2+1,5,5);ctx.fillRect(4,-h/2+1,5,5);
      ctx.fillStyle='#ff8800';ctx.shadowColor='#ff8800';ctx.shadowBlur=5*fl;
      ctx.fillRect(-8,-h/2,4,3);ctx.fillRect(5,-h/2,4,3);
      ctx.shadowBlur=0;

    }else{
      // === PURPLE HEAVY BOMBER ===
      const bg=ctx.createLinearGradient(-w/2,0,w/2,0);
      bg.addColorStop(0,'#1a0a2e');bg.addColorStop(.3,'#6c3483');bg.addColorStop(.6,'#8e44ad');bg.addColorStop(1,'#1a0a2e');
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.moveTo(0,h/2);
      ctx.lineTo(w/2-5,9);ctx.lineTo(w/2,-3);ctx.lineTo(w/2-2,-h/2+8);
      ctx.lineTo(w/2-8,-h/2);ctx.lineTo(-w/2+8,-h/2);
      ctx.lineTo(-w/2+2,-h/2+8);ctx.lineTo(-w/2,-3);ctx.lineTo(-w/2+5,9);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#d7bde2';ctx.lineWidth=1.2;ctx.stroke();

      // Armor panel seams
      ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(-w/2+8,-h/2+14);ctx.lineTo(w/2-8,-h/2+14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-w/2+10,0);ctx.lineTo(w/2-10,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-7,h/2-6);ctx.lineTo(7,h/2-6);ctx.stroke();

      // Cockpit
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(0,5,6,11,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,200,255,.25)';ctx.beginPath();ctx.ellipse(0,3,4,7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-1,1,2,3,0,0,Math.PI*2);ctx.fill();

      // Side turrets
      ctx.fillStyle='#3d1a5e';
      ctx.beginPath();ctx.moveTo(-w/2-4,-7);ctx.lineTo(-w/2+2,-3);ctx.lineTo(-w/2+2,1);ctx.lineTo(-w/2-4,-3);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(w/2+4,-7);ctx.lineTo(w/2-2,-3);ctx.lineTo(w/2-2,1);ctx.lineTo(w/2+4,-3);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(-w/2-1,-3,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(w/2+1,-3,2,0,Math.PI*2);ctx.fill();

      // Triple engines
      ctx.fillStyle='#222';ctx.fillRect(-11,-h/2,5,6);ctx.fillRect(-3,-h/2-2,6,7);ctx.fillRect(6,-h/2,5,6);
      ctx.fillStyle='#cc44ff';ctx.shadowColor='#cc44ff';ctx.shadowBlur=5*fl;
      ctx.fillRect(-10,-h/2,4,4);ctx.fillRect(-2,-h/2-1,5,5);ctx.fillRect(7,-h/2,4,4);
      ctx.shadowBlur=0;

      // Nose cannon
      ctx.fillStyle='#222';ctx.fillRect(-2.5,h/2-7,5,9);
      ctx.fillStyle='#8e44ad';ctx.beginPath();ctx.arc(0,h/2+3,3.5,0,Math.PI*2);ctx.fill();
    }

    ctx.restore();
  }
}

class Boss{
  constructor(name,level){
    this.name=name;
    this.color=bossColors[name];
    this.level=level;
    this.w=90;this.h=150;
    this.x=W/2;this.y=-180;
    this.targetY=120;
    this.maxHp=Math.floor((20+level*10)*(difficulty==='easy'?0.5:1));
    this.hp=this.maxHp;
    this.phase=0;this.shootTimer=0;
    this.animTime=Math.random()*Math.PI*2;
    this.entering=true;this.entrancePhase=0;
    this.flashTimer=0;this.deathTimer=0;
    this.armL=0;this.armR=0;this.legL=0;this.legR=0;
    this.bodyBob=0;this.specialTimer=0;
    this.summonedEnemies=[];
    // Entrance animation
    this.warningTimer=0;this.shockwaves=[];
  }
  update(){
    this.animTime+=.05;
    if(this.entering){
      this.warningTimer++;
      if(this.warningTimer<60){
        // WARNING phase - boss descends
        this.y=-100+(this.warningTimer/60)*50;
        if(this.warningTimer===30)addShake(12,20);
        if(this.warningTimer<40)return;
      }
      this.y+=(this.targetY-this.y)*.04;
      if(Math.abs(this.y-this.targetY)<3&&this.warningTimer>60){
        this.y=this.targetY;
        this.entering=false;
        // Entrance shockwave
        for(let i=0;i<3;i++){
          this.shockwaves.push({r:20,alpha:1,delay:i*8});
        }
        addShake(10,15);
      }
      return;
    }

    // Shockwave rings
    this.shockwaves.forEach(s=>{s.r+=6;s.alpha-=.03});
    this.shockwaves=this.shockwaves.filter(s=>s.alpha>0);

    this.bodyBob=Math.sin(this.animTime*.7)*8;
    // Movement patterns (same as original)
    if(this.name==='李亚增'){
      this.x+=Math.sin(this.animTime*.5)*1.5;
      if(Math.random()<.008)this.summonMinions();
    }else if(this.name==='李彦祥'){
      this.x+=Math.sin(this.animTime*.8)*2;
    }else if(this.name==='李飞'){
      this.x+=Math.sin(this.animTime*1.4)*3.5;
      if(this.hp<this.maxHp*.5)this.x+=Math.cos(this.animTime*1.1)*3;
    }else if(this.name==='杨小军'){
      this.x+=Math.sin(this.animTime*.3)*3;
      if(this.hp<this.maxHp*.5)this.x+=Math.sin(this.animTime*.7)*2;
    }else if(this.name==='王小涛'){
      const pp=(this.maxHp-this.hp)/this.maxHp;
      this.x+=Math.sin(this.animTime*.4+pp)*2.5;
      if(pp>.3)this.x+=Math.cos(this.animTime*.65)*1.5;
      if(pp>.6)this.x+=Math.sin(this.animTime*.9)*2;
    }else if(this.name==='伍建忠'){
      const pct=(this.maxHp-this.hp)/this.maxHp;
      this.x+=Math.sin(this.animTime*.5)*2;
      if(pct>.25)this.x+=Math.cos(this.animTime*.7)*2;
      if(pct>.5)this.x+=Math.sin(this.animTime*1.2)*2.5;
      if(pct>.75)this.x+=Math.cos(this.animTime*.9)*3;
    }
    this.x=Math.max(this.w/2+20,Math.min(W-this.w/2-20,this.x));

    this.armL=Math.sin(this.animTime*2)*.4;
    this.armR=Math.sin(this.animTime*2+Math.PI)*.4;
    this.legL=Math.sin(this.animTime*3)*.3;
    this.legR=Math.sin(this.animTime*3+Math.PI)*.3;

    this.shootTimer--;
    this.specialTimer--;
    const phasePct=(this.maxHp-this.hp)/this.maxHp;
    if(phasePct>.5&&this.phase<1)this.phase=1;
    if(phasePct>.75&&this.phase<2)this.phase=2;

    // Near-death: increased fire rate
    const nearDeath=this.hp<this.maxHp*.2;
    if(this.shootTimer<=0&&!this.entering)this.bossAttack();

    // Near-death rapid panting effect
    if(nearDeath&&frameCount%3===0){
      spawnParticle(this.x+Math.random()*30-15,this.y+Math.random()*20-10,(Math.random()-.5)*2,(Math.random()-.5)*2,'#ff0000',8+Math.random()*6,2+Math.random()*3,'glow');
    }

    // Particle halo
    if(frameCount%6===0){
      const ha=Math.random()*Math.PI*2;
      const hr=35+Math.random()*15;
      const hpx=this.x+Math.cos(ha)*hr;
      const hpy=this.y+this.bodyBob+Math.sin(ha)*hr;
      const hColor=this.hp<this.maxHp*.3?'#ff4444':this.color.glow;
      spawnParticle(hpx,hpy,(Math.random()-.5)*.5,(Math.random()-.5)*.5,hColor,15+Math.random()*20,1.5+Math.random()*2,'glow');
    }

    if(this.flashTimer>0)this.flashTimer--;

    // Summoned minions
    if(this.name==='李亚增'&&this.summonedEnemies.length>0){
      this.summonedEnemies.forEach(e=>{e.y+=e.speed;e.shootTimer--});
      this.summonedEnemies=this.summonedEnemies.filter(e=>e.y<H+50);
    }
  }
  summonMinions(){
    for(let i=0;i<2;i++){
      this.summonedEnemies.push({x:this.x-20+Math.random()*40,y:this.y+30,speed:2+Math.random()*2,shootTimer:40+Math.random()*40,w:20,h:20});
    }
  }
  bossAttack(){
    const dm=difficulty==='easy'?1.6:1;
    const baseCD=(this.level>=4?18:this.level>=2?25:30);
    const nearDeathMult=this.hp<this.maxHp*.2?.6:1;
    this.shootTimer=Math.max(8,(baseCD-this.level*3-this.phase*5)*dm*nearDeathMult);
    const bx=this.x,by=this.y+20;
    const bs=(difficulty==='easy'?0.75:1);
    if(this.name==='李亚增'){
      const a=Math.atan2(player.y-by,player.x-bx);
      for(let i=-1;i<=1;i++)bullets.push(new Bullet(bx,by,Math.cos(a+i*.3)*4*bs,Math.sin(a+i*.3)*4*bs,false,'#f39c12'));
    }else if(this.name==='李彦祥'){
      const count=Math.floor((4+this.phase*2)*bs);
      for(let i=0;i<count;i++){
        const a=(Math.PI*2/count)*i+this.animTime*.3;
        bullets.push(new Bullet(bx,by,Math.cos(a)*3.5*bs,Math.sin(a)*3.5*bs,false,'#e74c3c'));
      }
    }else if(this.name==='李飞'){
      const a=Math.atan2(player.y-by,player.x-bx);
      for(let i=-2;i<=2;i++)bullets.push(new Bullet(bx,by,Math.cos(a+i*.2)*5*bs,Math.sin(a+i*.2)*5*bs,false,'#bb8fce'));
      if(this.phase>=1)for(let i=0;i<3;i++){const a2=Math.random()*Math.PI*2;bullets.push(new Bullet(bx,by,Math.cos(a2)*4*bs,Math.sin(a2)*4*bs,false,'#8e44ad'))}
    }else if(this.name==='杨小军'){
      for(let i=-2;i<=2;i++)bullets.push(new Bullet(bx+i*8,by,0,5*bs,false,'#2ecc71'));
      if(this.phase>=1)for(let i=-3;i<=3;i+=2)bullets.push(new Bullet(bx+i*6,by,i*.8,4.5*bs,false,'#27ae60'));
    }else if(this.name==='王小涛'){
      const a=Math.atan2(player.y-by,player.x-bx);
      for(let i=-1;i<=1;i++)bullets.push(new Bullet(bx,by,Math.cos(a+i*.25)*4.5*bs,Math.sin(a+i*.25)*4.5*bs,false,'#f1c40f'));
      if(this.phase>=1){for(let i=0;i<4;i++){const a2=(Math.PI*2/4)*i+this.animTime*.2;bullets.push(new Bullet(bx,by,Math.cos(a2)*3*bs,Math.sin(a2)*3*bs,false,'#e67e22'))}}
      if(this.phase>=2){for(let i=-3;i<=3;i++)bullets.push(new Bullet(bx+i*7,by,0,5.5*bs,false,'#e74c3c'))}
    }else if(this.name==='伍建忠'){
      const a=Math.atan2(player.y-by,player.x-bx);
      for(let i=-1;i<=1;i++)bullets.push(new Bullet(bx,by,Math.cos(a+i*.3)*4.5*bs,Math.sin(a+i*.3)*4.5*bs,false,'#e74c3c'));
      if(this.phase>=1){for(let i=0;i<5;i++){const a2=(Math.PI*2/5)*i+this.animTime*.25;bullets.push(new Bullet(bx,by,Math.cos(a2)*3.5*bs,Math.sin(a2)*3.5*bs,false,'#f1948a'))}}
      if(this.phase>=2){for(let i=-3;i<=3;i++)bullets.push(new Bullet(bx+i*7,by,0,5.5*bs,false,'#922b21'))}
    }
  }
  hit(dmg){
    this.hp-=dmg;
    this.flashTimer=5;
    sfxBossHit();
    spawnHitSpark(this.x+Math.random()*40-20,this.y+this.bodyBob+Math.random()*40-20,this.color.glow);
    spawnExplosion(this.x+Math.random()*40-20,this.y+this.bodyBob+Math.random()*40-20,6);
    addShake(3,5);
    if(this.hp<=0){
      score+=1000+this.level*500;
      addScorePopup(this.x,this.y,1000+this.level*500);
      for(let i=0;i<40;i++)spawnExplosion(this.x+Math.random()*80-40,this.y+Math.random()*80-40,15);
      addShake(18,25);
      return true;
    }
    return false;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y+this.bodyBob);

    // Entrance shockwave rings
    this.shockwaves.forEach(s=>{
      ctx.strokeStyle=`rgba(255,255,255,${s.alpha})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,20,s.r,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=`rgba(255,200,100,${s.alpha*.5})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,20,s.r+8,0,Math.PI*2);ctx.stroke();
    });

    if(this.flashTimer>0&&this.flashTimer%2===0){ctx.globalAlpha=.5}

    const nearDeath=this.hp<this.maxHp*.2;
    if(nearDeath&&Math.floor(frameCount/10)%2===0){
      ctx.shadowColor='#ff0000';ctx.shadowBlur=25;
    }

    const hpPct=this.hp/this.maxHp;
    const auraColor=hpPct<.3?'#ff4444':this.color.glow;
    const auraAlpha=hpPct<.3?'60':'45';
    const auraG=ctx.createRadialGradient(0,0,25,0,0,85);
    auraG.addColorStop(0,auraColor+auraAlpha);auraG.addColorStop(1,'transparent');
    ctx.fillStyle=auraG;ctx.beginPath();ctx.arc(0,0,85,0,Math.PI*2);ctx.fill();

    // === EXHAUST TRAIL (below feet, uses local coords since translate is active) ===
    const exFlame=Math.sin(this.animTime*6)*6+14;
    for(let i=0;i<2;i++){
      const ex=(i===0?-16:16),ey=62;
      const eg=ctx.createLinearGradient(ex,ey,ex,ey+exFlame+10);
      eg.addColorStop(0,this.color.glow);eg.addColorStop(.4,this.color.accent);eg.addColorStop(1,'transparent');
      ctx.fillStyle=eg;
      ctx.beginPath();ctx.moveTo(ex-5,ey);ctx.lineTo(ex-2,ey+exFlame*.6);ctx.lineTo(ex,ey+exFlame);ctx.lineTo(ex+2,ey+exFlame*.6);ctx.lineTo(ex+5,ey);ctx.fill();
    }

    // === SHOULDER PADS ===
    const shoulderY=-30;
    ctx.fillStyle=this.color.body;
    // Left shoulder
    ctx.save();ctx.translate(-28,shoulderY);
    roundRect(ctx,-16,-12,32,24,8);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=this.color.glow;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
    // Spike
    ctx.fillStyle=this.color.accent;ctx.beginPath();ctx.moveTo(-16,-8);ctx.lineTo(-22,-16);ctx.lineTo(-10,-8);ctx.fill();
    ctx.beginPath();ctx.moveTo(16,-8);ctx.lineTo(22,-16);ctx.lineTo(10,-8);ctx.fill();
    ctx.restore();
    // Right shoulder
    ctx.save();ctx.translate(28,shoulderY);
    roundRect(ctx,-16,-12,32,24,8);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=this.color.glow;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.color.accent;ctx.beginPath();ctx.moveTo(-16,-8);ctx.lineTo(-22,-16);ctx.lineTo(-10,-8);ctx.fill();
    ctx.beginPath();ctx.moveTo(16,-8);ctx.lineTo(22,-16);ctx.lineTo(10,-8);ctx.fill();
    ctx.restore();

    // === LEGS (armored mech style) ===
    const legLen=24;
    // Left leg
    ctx.save();ctx.translate(-14,35);ctx.rotate(this.legL);
    const lgL=ctx.createLinearGradient(0,0,0,legLen);
    lgL.addColorStop(0,this.color.accent);lgL.addColorStop(1,this.color.body);
    ctx.fillStyle=lgL;roundRect(ctx,-7,0,14,legLen,5);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=1.5;ctx.stroke();
    // Knee joint
    ctx.fillStyle=this.color.glow;ctx.beginPath();ctx.arc(0,legLen*.5,5,0,Math.PI*2);ctx.fill();
    // Boot
    ctx.fillStyle=this.color.accent;roundRect(ctx,-8,legLen-2,16,8,4);ctx.fill();
    ctx.restore();
    // Right leg
    ctx.save();ctx.translate(14,35);ctx.rotate(this.legR);
    const lgR=ctx.createLinearGradient(0,0,0,legLen);
    lgR.addColorStop(0,this.color.accent);lgR.addColorStop(1,this.color.body);
    ctx.fillStyle=lgR;roundRect(ctx,-7,0,14,legLen,5);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=this.color.glow;ctx.beginPath();ctx.arc(0,legLen*.5,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.color.accent;roundRect(ctx,-8,legLen-2,16,8,4);ctx.fill();
    ctx.restore();

    // === BODY (heavy mech torso) ===
    const bodyY=-5,bodyW=40,bodyH=42;
    // Main torso
    const bodyG=ctx.createLinearGradient(0,bodyY-bodyH/2,0,bodyY+bodyH/2);
    bodyG.addColorStop(0,this.color.accent);bodyG.addColorStop(.3,this.color.body);bodyG.addColorStop(.7,this.color.body);bodyG.addColorStop(1,this.color.glow);
    ctx.fillStyle=bodyG;
    roundRect(ctx,-bodyW/2,bodyY-bodyH/2,bodyW,bodyH,8);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=2.5;ctx.stroke();
    // Armor panel lines
    ctx.strokeStyle=this.color.glow;ctx.lineWidth=1;ctx.globalAlpha=.4;
    ctx.beginPath();ctx.moveTo(-bodyW/2+8,bodyY-bodyH/2+6);ctx.lineTo(bodyW/2-8,bodyY-bodyH/2+6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-bodyW/2+10,bodyY-bodyH/2+16);ctx.lineTo(bodyW/2-10,bodyY-bodyH/2+16);ctx.stroke();
    ctx.globalAlpha=1;
    // Chest core (pulsing)
    const corePulse=Math.sin(this.animTime*3)*.3+.7;
    const coreOuter=ctx.createRadialGradient(0,bodyY-2,3,0,bodyY-2,14*corePulse);
    coreOuter.addColorStop(0,'#fff');coreOuter.addColorStop(.4,this.color.glow);coreOuter.addColorStop(1,'transparent');
    ctx.fillStyle=coreOuter;ctx.beginPath();ctx.arc(0,bodyY-2,14*corePulse,0,Math.PI*2);ctx.fill();
    // Core inner
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,bodyY-2,4*corePulse,0,Math.PI*2);ctx.fill();

    // === HEAD & HELMET ===
    const headY=bodyY-bodyH/2-28,headR=24;
    // Helmet glow aura
    const hgAura=ctx.createRadialGradient(0,headY,headR*.4,0,headY,headR*1.4);
    hgAura.addColorStop(0,this.color.accent+'60');hgAura.addColorStop(1,'transparent');
    ctx.fillStyle=hgAura;ctx.beginPath();ctx.arc(0,headY,headR*1.4,0,Math.PI*2);ctx.fill();
    // Helmet base
    ctx.fillStyle=this.color.body;ctx.beginPath();ctx.arc(0,headY,headR+5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=3;ctx.stroke();
    // Helmet top crest
    ctx.fillStyle=this.color.accent;
    ctx.beginPath();ctx.moveTo(-6,headY-headR-5);ctx.lineTo(0,headY-headR-16);ctx.lineTo(6,headY-headR-5);ctx.closePath();ctx.fill();
    // Side antenna
    ctx.strokeStyle=this.color.glow;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-headR-4,headY-4);ctx.lineTo(-headR-14,headY-18);ctx.stroke();
    ctx.fillStyle=this.color.glow;ctx.beginPath();ctx.arc(-headR-14,headY-18,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(headR+4,headY-4);ctx.lineTo(headR+14,headY-18);ctx.stroke();
    ctx.fillStyle=this.color.glow;ctx.beginPath();ctx.arc(headR+14,headY-18,3,0,Math.PI*2);ctx.fill();

    // === FACE (visor style) ===
    ctx.save();
    ctx.beginPath();ctx.arc(0,headY,headR,0,Math.PI*2);ctx.clip();
    const faceG=ctx.createRadialGradient(0,headY-3,4,0,headY,headR);
    faceG.addColorStop(0,this.color.face);faceG.addColorStop(1,'#0a0a0a');
    ctx.fillStyle=faceG;ctx.fillRect(-headR,headY-headR,headR*2,headR*2);

    // Visor (T-shaped or V-shaped glowing visor)
    const visorY=headY-3;
    ctx.fillStyle=this.color.glow;ctx.shadowColor=this.color.glow;ctx.shadowBlur=10;
    ctx.beginPath();ctx.moveTo(-14,visorY-4);ctx.lineTo(-6,visorY);ctx.lineTo(-6,visorY+6);ctx.lineTo(-14,visorY+6);
    ctx.lineTo(-14,visorY+3);ctx.lineTo(-6,visorY+1);ctx.lineTo(-14,visorY-2);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(14,visorY-4);ctx.lineTo(6,visorY);ctx.lineTo(6,visorY+6);ctx.lineTo(14,visorY+6);
    ctx.lineTo(14,visorY+3);ctx.lineTo(6,visorY+1);ctx.lineTo(14,visorY-2);ctx.closePath();ctx.fill();
    // Center visor bar
    ctx.fillRect(-3,visorY-2,6,10);
    ctx.shadowBlur=0;

    // Mouth plate
    const mouthY=headY+12;
    ctx.fillStyle=this.color.body;
    roundRect(ctx,-10,mouthY-4,20,8,3);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=1;ctx.stroke();
    // Grill detail
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(i*2.5,mouthY-2);ctx.lineTo(i*2.5,mouthY+2);ctx.stroke();
    }
    ctx.restore();

    // Helmet rim
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,headY,headR+5,0,Math.PI*2);ctx.stroke();

    // === ARMS (heavy cannon arms) ===
    // Left arm
    ctx.save();ctx.translate(-bodyW/2-8,bodyY-bodyH/2+10);ctx.rotate(-.2+this.armL);
    const armLG=ctx.createLinearGradient(0,0,0,30);
    armLG.addColorStop(0,this.color.body);armLG.addColorStop(.5,this.color.accent);armLG.addColorStop(1,this.color.body);
    ctx.fillStyle=armLG;roundRect(ctx,-8,-4,16,32,6);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=1.5;ctx.stroke();
    // Cannon barrel
    ctx.fillStyle=this.color.glow;ctx.fillRect(-6,24,12,18);
    ctx.fillStyle='#333';ctx.fillRect(-4,24,8,4);
    // Muzzle flash
    const mf=Math.sin(this.animTime*4)*.4+.6;
    ctx.fillStyle=this.color.glow;ctx.shadowColor=this.color.glow;ctx.shadowBlur=8*mf;
    ctx.beginPath();ctx.arc(0,44,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.restore();
    // Right arm
    ctx.save();ctx.translate(bodyW/2+8,bodyY-bodyH/2+10);ctx.rotate(.2+this.armR);
    const armRG=ctx.createLinearGradient(0,0,0,30);
    armRG.addColorStop(0,this.color.body);armRG.addColorStop(.5,this.color.accent);armRG.addColorStop(1,this.color.body);
    ctx.fillStyle=armRG;roundRect(ctx,-8,-4,16,32,6);ctx.fill();
    ctx.strokeStyle=this.color.accent;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=this.color.glow;ctx.fillRect(-6,24,12,18);
    ctx.fillStyle='#333';ctx.fillRect(-4,24,8,4);
    ctx.fillStyle=this.color.glow;ctx.shadowColor=this.color.glow;ctx.shadowBlur=8*mf;
    ctx.beginPath();ctx.arc(0,44,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.restore();

    // === BACK THRUSTERS (cape-like) ===
    ctx.fillStyle='#333';
    ctx.fillRect(-bodyW/2-6,bodyY+bodyH/2-6,14,10);
    ctx.fillRect(bodyW/2-8,bodyY+bodyH/2-6,14,10);
    const btFlame=Math.sin(this.animTime*4)*4+12;
    const btG=ctx.createLinearGradient(0,bodyY+bodyH/2+4,0,bodyY+bodyH/2+btFlame+5);
    btG.addColorStop(0,this.color.accent);btG.addColorStop(.5,this.color.glow);btG.addColorStop(1,'transparent');
    ctx.fillStyle=btG;
    ctx.beginPath();ctx.moveTo(-bodyW/2-4,bodyY+bodyH/2+4);ctx.lineTo(-bodyW/2,bodyY+bodyH/2+btFlame);ctx.lineTo(-bodyW/2+4,bodyY+bodyH/2+4);ctx.fill();
    ctx.beginPath();ctx.moveTo(bodyW/2-8,bodyY+bodyH/2+4);ctx.lineTo(bodyW/2-4,bodyY+bodyH/2+btFlame);ctx.lineTo(bodyW/2,bodyY+bodyH/2+4);ctx.fill();

    // === HEALTH BAR ===
    const barW=80,barH=8,barY=-95;
    ctx.fillStyle='rgba(0,0,0,.8)';roundRect(ctx,-barW/2-2,barY-2,barW+4,barH+4,3);ctx.fill();
    // Gradient based on HP
    const hpG=ctx.createLinearGradient(0,barY,0,barY+barH);
    if(hpPct>.5){hpG.addColorStop(0,'#2ecc71');hpG.addColorStop(1,'#27ae60')}
    else if(hpPct>.25){hpG.addColorStop(0,'#f39c12');hpG.addColorStop(1,'#e67e22')}
    else{hpG.addColorStop(0,'#e74c3c');hpG.addColorStop(1,'#c0392b')}
    ctx.fillStyle=hpG;ctx.fillRect(-barW/2,barY,barW*hpPct,barH);
    // HP segments
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=.5;
    for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(-barW/2+barW*i/5,barY);ctx.lineTo(-barW/2+barW*i/5,barY+barH);ctx.stroke()}
    // Name with glow
    ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=4;
    ctx.font='bold 12px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText(this.name,0,barY-8);
    ctx.fillStyle=this.color.accent;ctx.font='bold 9px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('BOSS Lv.'+(this.level+1),0,barY+barH+12);

    ctx.shadowColor='transparent';ctx.shadowBlur=0;
    ctx.restore();
  }
}

class Bullet{
  constructor(x,y,vx,vy,isPlayer,color,shape){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.isPlayer=isPlayer;
    this.color=color||(isPlayer?'#f1c40f':'#e74c3c');
    this.r=isPlayer?3:4;
    this.shape=shape||'circle';
    this.age=0;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.age++}
  draw(ctx){
    ctx.save();
    // Glow
    ctx.shadowColor=this.color;ctx.shadowBlur=this.isPlayer?8:5;
    ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    // Inner bright core
    ctx.fillStyle='#fff';ctx.globalAlpha=.7;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
    ctx.restore();

    // Bullet trail particles
    if(frameCount%2===0&&this.age>1){
      spawnBulletTrail(this.x,this.y,this.color);
    }
  }
}

class PowerUp{
  constructor(x,y,type){
    this.x=x;this.y=y;this.type=type;
    this.speed=2;this.r=14;this.timer=Math.random()*Math.PI*2;
  }
  update(){this.y+=this.speed;this.timer+=.06}
  draw(ctx){
    ctx.save();ctx.translate(this.x,this.y);
    const glow=Math.sin(this.timer)*.3+.7;
    const colors={spread:'#f1c40f',shield:'#2ecc71',heal:'#e74c3c',bomb:'#e67e22'};
    const symbols={spread:'S',shield:'盾',heal:'❤',bomb:'爆'};
    const color=colors[this.type];

    // Rotating halo ring
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=glow*.5+.2;
    ctx.beginPath();ctx.arc(0,0,this.r+4,this.timer,this.timer+Math.PI*1.5);ctx.stroke();
    ctx.globalAlpha=1;

    // Main orb
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=14*glow;
    ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Inner highlight
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(-3,-3,this.r*.35,0,Math.PI*2);ctx.fill();
    // Symbol
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(symbols[this.type],0,1);
    ctx.restore();
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function spawnPowerUp(x,y){
  // Favor spread early (level 0-1), balance later
  let types;
  if(level<=0)types=['spread','spread','spread','shield','heal','bomb'];
  else if(level<=1)types=['spread','spread','shield','shield','heal','bomb'];
  else types=['spread','spread','shield','shield','heal','bomb'];
  powerUps.push(new PowerUp(x,y,types[Math.floor(Math.random()*types.length)]));
}

function useBomb(){
  if(bombs<=0)return;
  bombs--;
  sfxBomb();
  bombFlash=15;
  addShake(12,15);
  enemies.forEach(e=>{score+=e.score;spawnExplosion(e.x,e.y,8)});
  enemies.length=0;
  bullets.forEach(b=>{if(!b.isPlayer)spawnExplosion(b.x,b.y,3)});
  bullets=bullets.filter(b=>b.isPlayer);
  if(boss&&boss.name==='李亚增')boss.summonedEnemies.length=0;
}

// ==================== WAVE SYSTEM ====================
function spawnWave(){
  wavesCleared++;
  const mult=difficulty==='easy'?0.7:1.3;
  const count=Math.floor((3+wavesCleared+level*1.5)*mult);
  for(let i=0;i<count;i++){
    const type=Math.random()<.15?'large':Math.random()<.35?'medium':'small';
    enemies.push(new Enemy(30+Math.random()*(W-60),-30-Math.random()*200,type));
  }
}

// ==================== GAME FLOW ====================
function resetGame(){
  score=0;lives=5;level=0;bombs=3;
  enemies=[];bullets=[];powerUps=[];particles.length=0;particleIndex=0;
  scorePopups.length=0;boss=null;
  wavesCleared=0;
  comboCount=0;comboTimer=0;comboDisplay=0;comboFlash=0;
  rageMode=false;rageTimer=0;lastShockwave=0;
  bombFlash=0;shakeAmount=0;shakeDuration=0;
  player=new Player();
  spawnWave();
  state=STATE.PLAYING;
}

function startGame(){
  if(state!==STATE.MENU&&state!==STATE.DIFF_SELECT)return;
  initAudio();
  state=STATE.DIFF_SELECT;
}

function startBossFight(){
  state=STATE.BOSS_INTRO;
  stateTimer=0;bossIntroTimer=110;
  sfxBossIntro();
  addShake(8,20);
  const name=bossNames[level];
  boss=new Boss(name,level);
  enemies.forEach(e=>spawnExplosion(e.x,e.y,5));
  enemies.length=0;
  bullets=bullets.filter(b=>b.isPlayer);
}

function nextLevel(){
  level++;
  if(level>=bossNames.length){
    state=STATE.VICTORY;sfxVictory();
  }else{
    wavesCleared=0;
    boss=null;
    lives=Math.min(lives+1,5);
    spawnWave();
    state=STATE.PLAYING;
  }
}

// ==================== COLLISION ====================
function rectCollide(ax,ay,aw,ah,bx,by,bw,bh){
  return ax-aw/2<bx+bw/2&&ax+aw/2>bx-bw/2&&ay-ah/2<by+bh/2&&ay+ah/2>by-bh/2;
}

// ==================== MAIN LOOP ====================
function update(){
  frameCount++;
  updateShake();

  if(bombFlash>0)bombFlash--;

  if(state===STATE.MENU||state===STATE.DIFF_SELECT||state===STATE.GAME_OVER||state===STATE.VICTORY)return;

  if(state===STATE.BOSS_INTRO){
    stateTimer++;
    if(stateTimer>=bossIntroTimer){stateTimer=0;state=STATE.PLAYING}
    if(boss)boss.update();
    return;
  }

  updateCombo();

  if(rageMode&&frameCount%4===0){
    spawnParticle(player.x+Math.random()*10-5,player.y+Math.random()*10-5,(Math.random()-.5)*2,(Math.random()-.5)*2,'#ff4444',10+Math.random()*10,2,'glow');
  }

  player.update();
  if(lives<=0)return;

  bullets.forEach(b=>b.update());
  bullets=bullets.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);

  enemies.forEach(e=>e.update());
  enemies=enemies.filter(e=>e.y<H+60);

  if(boss){
    boss.update();
    if(boss.name==='李亚增'){
      boss.summonedEnemies.forEach((e,i)=>{
        if(e.shootTimer<=0&&e.y>0&&e.y<H){
          e.shootTimer=60+Math.random()*40;
          const a=Math.atan2(player.y-e.y,player.x-e.x);
          bullets.push(new Bullet(e.x,e.y,Math.cos(a)*3,Math.sin(a)*3,false,'#e67e22'));
        }
      });
    }
  }

  powerUps.forEach(p=>p.update());
  powerUps=powerUps.filter(p=>p.y<H+30);

  particles.forEach(p=>p.update());
  // Remove dead particles (don't splice, just filter - but with cap we manage via index)
  for(let i=particles.length-1;i>=0;i--){if(particles[i].life<=0)particles.splice(i,1)}

  scorePopups.forEach(s=>{s.y+=s.vy;s.life--});
  for(let i=scorePopups.length-1;i>=0;i--){if(scorePopups[i].life<=0)scorePopups.splice(i,1)}

  // COLLISIONS
  // Player bullets vs enemies
  for(let b of bullets){
    if(!b.isPlayer)continue;
    for(let e of enemies){
      if(rectCollide(b.x,b.y,6,6,e.x,e.y,e.w,e.h)){
        b.y=-999;
        if(e.hit(1)){const idx=enemies.indexOf(e);if(idx>=0)enemies.splice(idx,1)}
        break;
      }
    }
  }
  // Player bullets vs boss
  if(boss&&!boss.entering&&boss.hp>0){
    for(let b of bullets){
      if(!b.isPlayer)continue;
      if(rectCollide(b.x,b.y,6,6,boss.x,boss.y+boss.bodyBob,boss.w,boss.h)){
        b.y=-999;
        if(boss.hit(1)){
          spawnExplosion(boss.x,boss.y,40);
          boss=null;
          if(level>=bossNames.length-1){state=STATE.VICTORY;sfxVictory()}
          else{state=STATE.LEVEL_COMPLETE;levelCompleteTimer=0}
          addShake(15,20);
        }
        break;
      }
    }
  }
  // Enemy bullets vs player
  for(let b of bullets){
    if(b.isPlayer)continue;
    if(rectCollide(b.x,b.y,8,8,player.x,player.y,player.w-10,player.h-10)){
      b.y=-999;
      player.hit();
      break;
    }
  }
  // Enemies vs player
  for(let e of enemies){
    if(rectCollide(e.x,e.y,e.w,e.h,player.x,player.y,player.w-10,player.h-10)){
      enemies.splice(enemies.indexOf(e),1);
      spawnExplosion(e.x,e.y,10);
      player.hit();
      break;
    }
  }
  // Summoned minions vs player
  if(boss&&boss.name==='李亚增'){
    for(let e of boss.summonedEnemies){
      if(rectCollide(e.x,e.y,e.w,e.h,player.x,player.y,player.w-10,player.h-10)){
        boss.summonedEnemies.splice(boss.summonedEnemies.indexOf(e),1);
        spawnExplosion(e.x,e.y,8);
        player.hit();
        break;
      }
    }
  }
  // Player bullets vs summoned minions
  if(boss&&boss.name==='李亚增'){
    for(let b of bullets){
      if(!b.isPlayer)continue;
      for(let e of boss.summonedEnemies){
        if(rectCollide(b.x,b.y,6,6,e.x,e.y,e.w,e.h)){
          b.y=-999;
          spawnExplosion(e.x,e.y,6);
          score+=50;addCombo();
          boss.summonedEnemies.splice(boss.summonedEnemies.indexOf(e),1);
          break;
        }
      }
    }
  }
  // Power ups vs player
  for(let p of powerUps){
    if(rectCollide(p.x,p.y,p.r*2,p.r*2,player.x,player.y,player.w,player.h)){
      sfxPowerUp();
      // Pickup light column
      for(let i=0;i<8;i++)spawnParticle(p.x,p.y,Math.random()*2-1,-3-Math.random()*3,p.type==='spread'?'#f1c40f':p.type==='shield'?'#2ecc71':p.type==='heal'?'#e74c3c':'#e67e22',15+Math.random()*15,2+Math.random()*3,'glow');
      if(p.type==='spread')player.power=Math.min(3,player.power+1);
      else if(p.type==='shield')player.shield=true;
      else if(p.type==='heal')lives=Math.min(5,lives+1);
      else if(p.type==='bomb')bombs=Math.min(5,bombs+1);
      powerUps.splice(powerUps.indexOf(p),1);
    }
  }

  // WAVE MANAGEMENT
  if(!boss&&state===STATE.PLAYING){
    if(enemies.length===0){
      if(wavesCleared>=wavesPerLevel)startBossFight();
      else spawnWave();
    }
  }

  // LEVEL COMPLETE
  if(state===STATE.LEVEL_COMPLETE){
    levelCompleteTimer++;
    if(levelCompleteTimer>60)nextLevel();
  }

  // Bomb key
  if((keys[' ']||keys['Spacebar'])&&state===STATE.PLAYING){useBomb();keys[' ']=false;keys['Spacebar']=false}
}

function drawNeonText(ctx,text,x,y,color,size,glowSize){
  ctx.save();
  ctx.shadowColor=color;ctx.shadowBlur=glowSize||15;
  ctx.fillStyle='#fff';ctx.font=`bold ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;ctx.textAlign='center';
  ctx.fillText(text,x,y);
  ctx.shadowBlur=0;
  // Second pass for stronger glow
  ctx.fillStyle=color;
  ctx.shadowColor=color;ctx.shadowBlur=(glowSize||15)*.6;
  ctx.fillText(text,x,y);
  ctx.shadowBlur=0;
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  const sx=shakeAmount>0?(Math.random()-.5)*shakeAmount:0;
  const sy=shakeAmount>0?(Math.random()-.5)*shakeAmount:0;
  ctx.translate(offsetX+sx,offsetY+sy);
  ctx.scale(scale,scale);

  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();

  drawBackground(ctx);

  // Draw particles (additive blending for explosions)
  ctx.globalCompositeOperation='lighter';
  particles.forEach(p=>{if(p.type==='glow'||p.type==='spark')p.draw(ctx)});
  ctx.globalCompositeOperation='source-over';
  particles.forEach(p=>{if(p.type!=='glow'&&p.type!=='spark')p.draw(ctx)});

  // Draw power ups
  powerUps.forEach(p=>p.draw(ctx));
  // Draw bullets
  bullets.forEach(b=>b.draw(ctx));
  // Draw enemies
  enemies.forEach(e=>e.draw(ctx));
  // Summoned minions
  if(boss&&boss.name==='李亚增'){
    boss.summonedEnemies.forEach(e=>{
      ctx.fillStyle='#e67e22';ctx.beginPath();
      ctx.moveTo(0+e.x,e.h/2+e.y);ctx.lineTo(-e.w/2+e.x,-e.h/3+e.y);
      ctx.lineTo(0+e.x,-e.h/2+e.y);ctx.lineTo(e.w/2+e.x,-e.h/3+e.y);
      ctx.closePath();ctx.fill();
    });
  }
  // Draw boss
  if(boss)boss.draw(ctx);
  // Draw player
  if(state!==STATE.BOSS_INTRO)player.draw(ctx);

  // --- NEON UI ---
  // Score with neon glow
  ctx.textAlign='left';
  drawNeonText(ctx,'分数: '+score,12,28,'#f1c40f',16,12);

  // Combo counter
  if(comboDisplay>=5){
    const comboScale=comboFlash>0?1.3:1;
    ctx.save();ctx.translate(W/2,60);ctx.scale(comboScale,comboScale);
    const comboColor=comboDisplay>=50?'#ff4444':comboDisplay>=30?'#ff8800':'#f1c40f';
    ctx.font=`bold ${comboDisplay>=30?28:22}px "PingFang SC","Microsoft YaHei",sans-serif`;
    if(comboDisplay>=30){
      // Gold edge for high combos
      ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=20;
      ctx.fillText(comboDisplay+'x COMBO',0,0);
      ctx.shadowBlur=0;
    }
    ctx.fillStyle=comboColor;ctx.shadowColor=comboColor;ctx.shadowBlur=12;
    ctx.fillText(comboDisplay+'x COMBO',0,0);
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // Rage mode indicator
  if(rageMode){
    const rageAlpha=.5+.5*Math.sin(frameCount*.2);
    ctx.fillStyle=`rgba(255,0,0,${rageAlpha*.3})`;ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('🔥 RAGE MODE 🔥',W/2,88);
  }

  // Right side UI
  ctx.textAlign='right';
  // Lives as heart gems
  let hearts='';
  for(let i=0;i<lives;i++)hearts+='❤';
  ctx.fillStyle='#e74c3c';ctx.shadowColor='#e74c3c';ctx.shadowBlur=8;
  ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(hearts,W-12,28);ctx.shadowBlur=0;

  // Bombs
  ctx.fillStyle='#e67e22';ctx.shadowColor='#e67e22';ctx.shadowBlur=6;
  ctx.fillText('💣 x'+bombs,W-12,50);ctx.shadowBlur=0;

  // Power level with neon
  const powerName=['','单发','双发','三发'][player.power];
  ctx.fillStyle='#f1c40f';ctx.shadowColor='#f1c40f';ctx.shadowBlur=5;
  ctx.fillText('火力: '+powerName,W-12,70);ctx.shadowBlur=0;

  // Difficulty indicator
  ctx.fillStyle=difficulty==='easy'?'#2ecc71':'#e74c3c';ctx.shadowColor=difficulty==='easy'?'#2ecc71':'#e74c3c';ctx.shadowBlur=5;
  ctx.font='13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(difficulty==='easy'?'简单':'困难',W-12,88);ctx.shadowBlur=0;

  // Level/wave info
  if(!boss&&state===STATE.PLAYING){
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.textAlign='center';ctx.font='13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('第'+(level+1)+'关  敌兵波次 '+(wavesCleared+1)+'/'+wavesPerLevel,W/2,28);
  }

  // Score popups
  scorePopups.forEach(s=>{
    const a=s.life/40;
    ctx.fillStyle=`rgba(255,215,0,${a})`;ctx.font='bold 14px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('+'+s.pts,s.x,s.y);
  });

  // BOSS INTRO OVERLAY
  if(state===STATE.BOSS_INTRO&&boss){
    const alpha=stateTimer<20?stateTimer/20:1;
    ctx.fillStyle=`rgba(0,0,0,${alpha*.75})`;ctx.fillRect(0,0,W,H);
    // WARNING text
    if(stateTimer<40&&Math.floor(stateTimer/6)%2===0){
      ctx.fillStyle='#ff0000';ctx.shadowColor='#ff0000';ctx.shadowBlur=40;
      ctx.font='bold 48px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
      ctx.fillText('⚠ WARNING ⚠',W/2,H/2-60);
      ctx.shadowBlur=0;
    }
    ctx.fillStyle='#fff';ctx.font='bold 30px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText(boss.name+' 来袭！',W/2,H/2);
    ctx.fillText('第 '+(level+1)+' 关 Boss',W/2,H/2+40);
  }

  // LEVEL COMPLETE
  if(state===STATE.LEVEL_COMPLETE){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    // KNOCK OUT text
    const koScale=1+.2*Math.sin(levelCompleteTimer*.15);
    ctx.save();ctx.translate(W/2,H/2-20);ctx.scale(koScale,koScale);
    ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=30;
    ctx.font='bold 42px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('KNOCK OUT!',0,0);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('Boss 击破！',0,35);ctx.restore();
  }

  // GAME OVER
  if(state===STATE.GAME_OVER){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    drawNeonText(ctx,'坠  毁',W/2,H/2-50,'#e74c3c',40,20);
    ctx.fillStyle='#fff';ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('最终分数: '+score,W/2,H/2+10);
    ctx.fillText('点击屏幕重新开始',W/2,H/2+55);
  }

  // VICTORY
  if(state===STATE.VICTORY){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    drawNeonText(ctx,'通 关！',W/2,H/2-60,'#f1c40f',42,25);
    ctx.fillStyle='#fff';ctx.font='17px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('所有 Boss 已被击败',W/2,H/2);
    ctx.fillText('最终分数: '+score,W/2,H/2+30);
    ctx.fillText('点击屏幕再来一局',W/2,H/2+70);
  }

  // DIFFICULTY SELECTION
  if(state===STATE.DIFF_SELECT){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    drawNeonText(ctx,'选择难度',W/2,H/2-90,'#fff',34,15);
    ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillText('简单模式：子弹少、Boss血薄，轻松通关看Boss',W/2,H/2-35);
    ctx.fillText('困难模式：弹幕密集，适合挑战',W/2,H/2-5);
    // Easy button
    const easyGlow=difficulty==='easy'?25:0;
    ctx.fillStyle='#27ae60';ctx.shadowColor='#27ae60';ctx.shadowBlur=easyGlow;
    roundRect(ctx,W/2-100,H/2+25,200,48,25);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('🟢 简 单',W/2,H/2+55);
    // Hard button
    const hardGlow=difficulty==='hard'?25:0;
    ctx.fillStyle='#e74c3c';ctx.shadowColor='#e74c3c';ctx.shadowBlur=hardGlow;
    roundRect(ctx,W/2-100,H/2+85,200,48,25);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('🔴 困 难',W/2,H/2+115);
  }

  // MENU OVERLAY
  if(state===STATE.MENU){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    const titleY=H*.3;
    // Title glow
    ctx.shadowColor='#ff6b6b';ctx.shadowBlur=40;
    ctx.fillStyle='#fff';ctx.font='bold 46px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('飞机大战',W/2,titleY);
    ctx.shadowBlur=0;
    ctx.fillStyle='#f39c12';ctx.font='bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('Boss Rush',W/2,titleY+38);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('击败你的朋友们！',W/2,titleY+68);
    const names=bossNames.join('  ·  ');
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(names,W/2,titleY+95);

    ctx.fillStyle='#fff';ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('电脑: 方向键移动 | 手机: 滑动操控',W/2,H*.68);
    ctx.fillText('空格键: 炸弹清屏',W/2,H*.71+20);
    // iOS fullscreen hint
    const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
    if(isIOS){
      ctx.fillStyle='rgba(255,200,100,.9)';ctx.font='bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('💡 全屏提示：用Safari打开后',W/2,H*.78);
      ctx.fillText('点击分享 → 添加到主屏幕 → 即可满屏畅玩',W/2,H*.78+22);
    }
  }

  // Bomb flash overlay
  if(bombFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${bombFlash/15})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  // HTML button visibility
  const startBtn=document.getElementById('start-btn');
  const bombBtn=document.getElementById('bomb-btn');
  const mobileHint=document.getElementById('mobile-hint');
  if(state===STATE.MENU){
    startBtn.style.display='block';startBtn.textContent='开始战斗';
    mobileHint.style.display='block';bombBtn.style.display='none';
  }else if(state===STATE.GAME_OVER||state===STATE.VICTORY){
    startBtn.style.display='block';
    startBtn.textContent=state===STATE.VICTORY?'再通关一次':'再来一局';
    mobileHint.style.display='none';bombBtn.style.display='none';
  }else{
    startBtn.style.display='none';mobileHint.style.display='none';
    bombBtn.style.display=state===STATE.DIFF_SELECT?'none':'block';
  }
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ==================== INIT ====================
initBackground();
player=new Player();
enemies=[];bullets=[];powerUps=[];
particles.length=0;boss=null;
gameLoop();

// Keyboard bomb
window.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Spacebar')&&state===STATE.PLAYING){e.preventDefault();useBomb()}
});
</script>
